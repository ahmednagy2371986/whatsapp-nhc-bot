name: Sunday 1PM WhatsApp NHC Sender

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (live, test-me, dry-run)'
        required: false
        default: 'live'
        type: choice
        options:
          - live
          - test-me
          - dry-run
  schedule:
    # Backup trigger at 09:42 UTC (12:42 PM UTC+3) every Sunday in case cron-job.org is paused
    - cron: '42 9 * * 0'

concurrency:
  group: whatsapp-nhc-sunday-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Riyadh
    steps:
      - name: Checkout repository (latest session)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Run WhatsApp Bot
        id: run_bot
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          BOT_MODE: ${{ github.event.inputs.mode || 'live' }}
        run: node bot.mjs

      - name: Save updated encrypted session & lastSentDate back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add session.enc config.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync encrypted whatsapp session [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No session changes to commit."
          fi
